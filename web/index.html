<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RingTracker</title>
<meta name="description" content="Schlaf, Puls, HRV und Bewegung vom RingConn-Ring, übersichtlich an einem Ort.">
<meta name="theme-color" content="#F4F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101411" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RingTracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="rt.css">
</head>
<body class="noapp">
<header class="app" id="header">
  <div class="inner">
    <button class="back" id="backBtn" aria-label="Zurück">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="titles">
      <h1><span class="logo" aria-hidden="true"><i></i></span><span id="title">RingTracker</span></h1>
      <div class="date" id="subtitle"></div>
    </div>
    <button class="iconbtn" id="importBtn" aria-label="Daten einfügen" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <section class="view" id="view-welcome"></section>
  <section class="view" id="view-heute"></section>
  <section class="view" id="view-woche"></section>
  <section class="view" id="view-profil"></section>
  <section class="view" id="view-detail"></section>
  <section class="view" id="view-schlaf"></section>
  <section class="view" id="view-import"></section>
</main>

<nav class="tabs" aria-label="Hauptnavigation">
  <div class="inner">
    <button data-tab="heute" aria-current="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Heute
    </button>
    <button data-tab="woche">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V8"/></svg>
      Woche
    </button>
    <button data-tab="profil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      Profil
    </button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="rt-import.js"></script>
<script src="rt-export.js"></script>
<script src="rt-beispiel.js"></script>
<script src="rt-app.js"></script>
</body>
</html>
