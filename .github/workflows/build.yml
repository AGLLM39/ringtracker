name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: Für den iOS-Simulator bauen
        run: |
          xcodebuild build \
            -project RingTracker.xcodeproj \
            -target RingTracker \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
